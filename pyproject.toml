[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-monorepo"
version = "0.1.0"
description = "ATLAS - Autonomous Task & Lifecycle Automation System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/atlas-core",
    "packages/atlas-storage",
    "packages/atlas-policy",
    "packages/atlas-observability",
    "packages/atlas-browser",
    "packages/atlas-observation",
    "packages/atlas-verification",
    "packages/atlas-models",
    "packages/atlas-agent",
    "packages/atlas-coordination",
    "packages/atlas-orchestration",
    "packages/atlas-marketplace",
    "packages/atlas-skills",
    "packages/atlas-distributed",
    "packages/atlas-enterprise",
    "packages/atlas-operator",
    "packages/atlas-multimodal",
    "packages/atlas-adaptive",
    "packages/atlas-federation",
    "packages/atlas-process",
    "packages/atlas-coding",
    "packages/atlas-code-intelligence",
    "packages/atlas-collaboration",
    "apps/api",
    "apps/cli",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "embedded-postgres>=18.0.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/atlas-core/src",
    "packages/atlas-storage/src",
    "packages/atlas-policy/src",
    "packages/atlas-observability/src",
    "packages/atlas-browser/src",
    "packages/atlas-observation/src",
    "packages/atlas-verification/src",
    "packages/atlas-models/src",
    "packages/atlas-agent/src",
    "packages/atlas-coordination/src",
    "packages/atlas-orchestration/src",
    "packages/atlas-marketplace/src",
    "packages/atlas-skills/src",
    "packages/atlas-distributed/src",
    "packages/atlas-enterprise/src",
    "packages/atlas-operator/src",
    "packages/atlas-multimodal/src",
    "packages/atlas-adaptive/src",
    "packages/atlas-federation/src",
    "packages/atlas-coding/src",
    "packages/atlas-code-intelligence/src",
    "packages/atlas-process/src",
    "packages/atlas-collaboration/src",
    "apps/api/src",
    "apps/cli/src",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["packages", "apps"]
extraPaths = [
    "packages/atlas-core/src",
    "packages/atlas-storage/src",
    "packages/atlas-policy/src",
    "packages/atlas-observability/src",
    "packages/atlas-browser/src",
    "packages/atlas-observation/src",
    "packages/atlas-verification/src",
    "packages/atlas-models/src",
    "packages/atlas-agent/src",
    "packages/atlas-coordination/src",
    "packages/atlas-orchestration/src",
    "packages/atlas-marketplace/src",
    "packages/atlas-skills/src",
    "packages/atlas-distributed/src",
    "packages/atlas-enterprise/src",
    "packages/atlas-operator/src",
    "packages/atlas-multimodal/src",
    "packages/atlas-adaptive/src",
    "packages/atlas-federation/src",
    "packages/atlas-coding/src",
    "packages/atlas-code-intelligence/src",
    "packages/atlas-process/src",
    "packages/atlas-collaboration/src",
    "apps/api/src",
    "apps/cli/src",
]


