[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-cli"
version = "0.16.8"
description = "ATLAS CLI — Native, Autonomous Developer Environment and Enterprise Coding Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "ATLAS Engineering Team", email = "maintainers@atlas.dev" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["agent", "cli", "coding-agent", "autonomous", "mcp", "developer-tools"]
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "psutil>=5.9.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.7.0",
    "pygments>=2.17.0",
]

[project.urls]
Homepage = "https://github.com/atlas-org/atlas"
Documentation = "https://docs.atlas.dev"
Repository = "https://github.com/atlas-org/atlas.git"
Issues = "https://github.com/atlas-org/atlas/issues"

[project.scripts]
atlas = "atlas_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/atlas_cli",
    "src/atlas_adaptive",
    "src/atlas_agent",
    "src/atlas_browser",
    "src/atlas_code_intelligence",
    "src/atlas_coding",
    "src/atlas_coordination",
    "src/atlas_core",
    "src/atlas_distributed",
    "src/atlas_enterprise",
    "src/atlas_federation",
    "src/atlas_marketplace",
    "src/atlas_models",
    "src/atlas_multimodal",
    "src/atlas_observability",
    "src/atlas_observation",
    "src/atlas_operator",
    "src/atlas_orchestration",
    "src/atlas_policy",
    "src/atlas_process",
    "src/atlas_skills",
    "src/atlas_storage",
    "src/atlas_verification",
]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "README.md",
    "pyproject.toml",
    "hatch_build.py",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
