[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-api"
version = "0.1.0"
description = "ATLAS API - FastAPI Application Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "atlas-storage",
    "atlas-observability",
    "atlas-orchestration",
    "atlas-marketplace",
    "atlas-skills",
    "atlas-distributed",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[tool.uv.sources]
atlas-core = { workspace = true }
atlas-storage = { workspace = true }
atlas-observability = { workspace = true }
atlas-orchestration = { workspace = true }
atlas-marketplace = { workspace = true }
atlas-skills = { workspace = true }
atlas-distributed = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_api"]
