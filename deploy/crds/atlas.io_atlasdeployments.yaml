apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: atlasdeployments.atlas.io
spec:
  group: atlas.io
  names:
    kind: AtlasDeployment
    listKind: AtlasDeploymentList
    plural: atlasdeployments
    singular: atlasdeployment
    shortNames:
      - adep
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - version
              properties:
                version:
                  type: string
                apiReplicas:
                  type: integer
                  minimum: 1
                  default: 2
                supervisorReplicas:
                  type: integer
                  minimum: 1
                  default: 2
                storageType:
                  type: string
                  enum: ["postgresql", "sqlite"]
                  default: "postgresql"
                postgresqlConnectionSecretRef:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Deploying", "Running", "Failed", "Upgrading", "RollingBack"]
                ready:
                  type: boolean
                currentVersion:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
      subresources:
        status: {}
