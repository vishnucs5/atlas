apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: atlasagentpools.atlas.io
spec:
  group: atlas.io
  names:
    kind: AtlasAgentPool
    listKind: AtlasAgentPoolList
    plural: atlasagentpools
    singular: atlasagentpool
    shortNames:
      - aap
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - replicas
                - agentTypes
              properties:
                replicas:
                  type: integer
                  minimum: 1
                agentTypes:
                  type: array
                  items:
                    type: string
                modelRouterRef:
                  type: string
            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
      subresources:
        status: {}
