apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: atlasexecutionpolicies.atlas.io
spec:
  group: atlas.io
  names:
    kind: AtlasExecutionPolicy
    listKind: AtlasExecutionPolicyList
    plural: atlasexecutionpolicies
    singular: atlasexecutionpolicy
    shortNames:
      - aep
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tenantId
              properties:
                tenantId:
                  type: string
                allowNetworkEgress:
                  type: boolean
                  default: false
                egressAllowlist:
                  type: array
                  items:
                    type: string
                requireGpuEncryption:
                  type: boolean
                  default: true
                maxExecutionDurationSeconds:
                  type: integer
                  minimum: 60
                  default: 1800
            status:
              type: object
              properties:
                enforced:
                  type: boolean
                activeViolations:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
      subresources:
        status: {}
