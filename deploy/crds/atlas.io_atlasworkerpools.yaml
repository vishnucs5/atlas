apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: atlasworkerpools.atlas.io
spec:
  group: atlas.io
  names:
    kind: AtlasWorkerPool
    listKind: AtlasWorkerPoolList
    plural: atlasworkerpools
    singular: atlasworkerpool
    shortNames:
      - awp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - minReplicas
                - maxReplicas
              properties:
                clusterRef:
                  type: string
                minReplicas:
                  type: integer
                  minimum: 0
                maxReplicas:
                  type: integer
                  minimum: 1
                targetQueueDepthPerWorker:
                  type: integer
                  minimum: 1
                  default: 4
                cooldownPeriodSeconds:
                  type: integer
                  minimum: 10
                  default: 60
                capabilities:
                  type: object
                  properties:
                    platform:
                      type: string
                    gpuRequired:
                      type: boolean
                    minVramGb:
                      type: integer
                    supportedRuntimes:
                      type: array
                      items:
                        type: string
                template:
                  type: object
                  properties:
                    image:
                      type: string
                    resources:
                      type: object
            status:
              type: object
              properties:
                currentReplicas:
                  type: integer
                readyReplicas:
                  type: integer
                activeTasks:
                  type: integer
                scalingPhase:
                  type: string
                  enum: ["Stable", "ScalingUp", "ScalingDown", "Cooldown"]
                lastScaleTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.minReplicas
          statusReplicasPath: .status.currentReplicas
