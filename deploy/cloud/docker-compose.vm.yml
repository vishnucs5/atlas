services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ATLAS_DOMAIN: ${ATLAS_DOMAIN:?set ATLAS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  caddy_data:
  caddy_config:
