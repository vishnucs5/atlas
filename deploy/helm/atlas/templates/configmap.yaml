apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "atlas.fullname" . }}-config
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
data:
  ATLAS_ENV: {{ .Values.global.environment | quote }}
  ATLAS_LOG_LEVEL: "INFO"
  ATLAS_DB_HOST: {{ .Values.postgresql.host | quote }}
  ATLAS_DB_PORT: {{ .Values.postgresql.port | quote }}
  ATLAS_DB_NAME: {{ .Values.postgresql.database | quote }}
  ATLAS_DB_USER: {{ .Values.postgresql.username | quote }}
  ATLAS_DB_SSLMODE: {{ .Values.postgresql.sslmode | quote }}
  ATLAS_DB_POOL_SIZE: {{ .Values.postgresql.poolSize | quote }}
  ATLAS_REDIS_HOST: {{ .Values.redis.host | quote }}
  ATLAS_REDIS_PORT: {{ .Values.redis.port | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otelCollectorEndpoint | quote }}
