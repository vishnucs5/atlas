apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "atlas.fullname" . }}-role
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "atlas.fullname" . }}-rolebinding
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "atlas.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "atlas.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
