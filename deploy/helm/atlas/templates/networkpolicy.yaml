{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas.fullname" . }}-networkpolicy
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atlas.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic to API pods on port 8000
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow traffic to PostgreSQL database
    - ports:
        - protocol: TCP
          port: {{ .Values.postgresql.port }}
    # Allow traffic to Redis
    - ports:
        - protocol: TCP
          port: {{ .Values.redis.port }}
    # Allow traffic to OpenTelemetry Collector
    - ports:
        - protocol: TCP
          port: 4318
{{- end }}
