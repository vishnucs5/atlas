apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas.fullname" . }}-worker-pool
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "atlas.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "atlas.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        atlas.io/platform: {{ .Values.worker.capabilities.platform | quote }}
        atlas.io/gpu-required: {{ .Values.worker.capabilities.gpuRequired | quote }}
    spec:
      serviceAccountName: {{ include "atlas.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: atlas-worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: ATLAS_WORKER_POOL_NAME
              value: "default-linux-pool"
            - name: ATLAS_CONTROL_PLANE_URL
              value: "http://{{ include "atlas.fullname" . }}-api:{{ .Values.api.service.port }}"
          envFrom:
            - configMapRef:
                name: {{ include "atlas.fullname" . }}-config
            - secretRef:
                name: {{ .Values.global.secrets.secretName | default (printf "%s-default-secrets" (include "atlas.fullname" .)) }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      volumes:
        - name: tmp-volume
          emptyDir: {}
