{{- if not .Values.global.secrets.secretName }}
# WARNING: This default secret resource is only rendered if an external secret is not specified.
# In production, specify .Values.global.secrets.secretName pointing to an externally managed secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atlas.fullname" . }}-default-secrets
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me-in-production"
  ATLAS_VAULT_ENCRYPTION_KEY: "change-me-in-production-fernet-key-32bytes="
  ATLAS_JWT_SECRET: "change-me-in-production-jwt-secret-key"
{{- end }}
