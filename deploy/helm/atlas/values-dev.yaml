# Development values for ATLAS Helm chart.
# Minimized resource footprints, local ingress, and single-replica deployments.

global:
  environment: "development"
  secrets:
    secretName: "atlas-dev-credentials"

api:
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  ingress:
    hosts:
      - host: "atlas.local"
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

supervisor:
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  podDisruptionBudget:
    enabled: false

worker:
  replicaCount: 1
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
