# Default values for ATLAS Helm chart.
# WARNING: NEVER commit plaintext passwords, tokens, or encryption keys in this file or any Git-tracked values file.

global:
  environment: "production"
  imageRegistry: "docker.io"
  imagePullSecrets: []
  secrets:
    # Name of the external Kubernetes Secret containing sensitive environment variables
    # Expected keys: POSTGRES_PASSWORD, REDIS_PASSWORD, ATLAS_VAULT_ENCRYPTION_KEY, ATLAS_JWT_SECRET
    secretName: "atlas-credentials"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# ATLAS API Gateway
api:
  replicaCount: 2
  image:
    repository: "atlas/api"
    tag: "0.12.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    metricsPort: 8000
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: "atlas.example.com"
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: atlas-api-tls
        hosts:
          - atlas.example.com
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 2
  startupProbe:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 10
  terminationGracePeriodSeconds: 30

# ATLAS Control Plane Supervisor
supervisor:
  replicaCount: 2
  image:
    repository: "atlas/api"
    tag: "0.12.0"
    pullPolicy: IfNotPresent
  command: ["dumb-init", "--", "uv", "run", "python", "-m", "atlas_api.main"]
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

# ATLAS Distributed Worker Fleet
worker:
  replicaCount: 3
  image:
    repository: "atlas/worker"
    tag: "0.12.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "2000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"
  capabilities:
    platform: "linux/amd64"
    desktopSupported: false
    gpuRequired: false
  terminationGracePeriodSeconds: 60

# External PostgreSQL Database configuration
postgresql:
  host: "atlas-postgres.internal"
  port: 5432
  database: "atlas_production"
  username: "atlas_user"
  sslmode: "require"
  poolSize: 20

# External Redis configuration
redis:
  host: "atlas-redis.internal"
  port: 6379
  ssl: false

# OpenTelemetry Tracing & Metrics
observability:
  otelCollectorEndpoint: "http://otel-collector.atlas-system.svc.cluster.local:4318"
  sampleRate: 1.0

# Network Security Policies
networkPolicy:
  enabled: true
  allowExternalEgress: false

# Prometheus ServiceMonitor
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
