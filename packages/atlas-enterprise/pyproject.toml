[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-enterprise"
version = "0.1.0"
description = "Enterprise Autonomous Operating Platform: Multi-Tenancy, IAM, Governance, Integrations & Compliance for ATLAS"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "atlas-storage",
    "atlas-policy",
    "atlas-observability",
    "atlas-coordination",
    "atlas-orchestration",
    "atlas-marketplace",
    "atlas-skills",
    "atlas-distributed",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "cryptography>=50.0.2",
]

[tool.uv.sources]
atlas-core = { workspace = true }
atlas-storage = { workspace = true }
atlas-policy = { workspace = true }
atlas-observability = { workspace = true }
atlas-coordination = { workspace = true }
atlas-orchestration = { workspace = true }
atlas-marketplace = { workspace = true }
atlas-skills = { workspace = true }
atlas-distributed = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_enterprise"]
