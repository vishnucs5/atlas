[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-storage"
version = "0.1.0"
description = "ATLAS Storage - Event-Sourced Storage (SQLite & PostgreSQL Interface)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "pydantic>=2.7.0",
]

[tool.uv.sources]
atlas-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_storage"]
