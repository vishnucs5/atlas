[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-federation"
version = "0.15.0"
description = "ATLAS Federated Autonomous Intelligence Network & Global Agent Interoperability Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "atlas-policy",
    "atlas-observability",
    "atlas-storage",
    "atlas-coordination",
    "atlas-marketplace",
    "atlas-skills",
    "atlas-enterprise",
    "pydantic>=2.7.0",
]

[tool.uv.sources]
atlas-core = { workspace = true }
atlas-policy = { workspace = true }
atlas-observability = { workspace = true }
atlas-storage = { workspace = true }
atlas-coordination = { workspace = true }
atlas-marketplace = { workspace = true }
atlas-skills = { workspace = true }
atlas-enterprise = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_federation"]
