[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-core"
version = "0.1.0"
description = "ATLAS Core - Domain Contracts, State Machine, and Interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_core"]
