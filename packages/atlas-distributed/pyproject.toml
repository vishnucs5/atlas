[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-distributed"
version = "0.1.0"
description = "Distributed Execution Network, Worker Agent, Enrollment, Remote Protocol, and Fault-Tolerant Scheduler for ATLAS"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "atlas-policy",
    "atlas-storage",
    "atlas-coordination",
    "atlas-orchestration",
    "atlas-observability",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
]

[tool.uv.sources]
atlas-core = { workspace = true }
atlas-policy = { workspace = true }
atlas-storage = { workspace = true }
atlas-coordination = { workspace = true }
atlas-orchestration = { workspace = true }
atlas-observability = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_distributed"]
