[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-models"
version = "0.1.0"
description = "Model Provider Adapters, Router, and Normalization Engine for ATLAS"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "atlas-observability",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
]

[tool.uv.sources]
atlas-core = { workspace = true }
atlas-observability = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_models"]
