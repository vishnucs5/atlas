[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-orchestration"
version = "0.1.0"
description = "Multi-Agent Intelligence, Autonomous Orchestration, DAG Planning, and Specialist Agents for ATLAS"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "atlas-models",
    "atlas-policy",
    "atlas-storage",
    "atlas-coordination",
    "atlas-observability",
    "atlas-verification",
    "atlas-browser",
    "atlas-coding",
    "atlas-code-intelligence",
    "pydantic>=2.7.0",
]

[tool.uv.sources]
atlas-core = { workspace = true }
atlas-models = { workspace = true }
atlas-policy = { workspace = true }
atlas-storage = { workspace = true }
atlas-coordination = { workspace = true }
atlas-observability = { workspace = true }
atlas-verification = { workspace = true }
atlas-browser = { workspace = true }
atlas-coding = { workspace = true }
atlas-code-intelligence = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_orchestration"]
