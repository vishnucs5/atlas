[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-adaptive"
version = "0.14.0"
description = "ATLAS Autonomous Self-Improvement, Evaluation & Adaptive Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "atlas-models",
    "atlas-policy",
    "atlas-observability",
    "atlas-storage",
    "atlas-coordination",
    "atlas-multimodal",
    "atlas-agent",
    "pydantic>=2.7.0",
]

[tool.uv.sources]
atlas-core = { workspace = true }
atlas-models = { workspace = true }
atlas-policy = { workspace = true }
atlas-observability = { workspace = true }
atlas-storage = { workspace = true }
atlas-coordination = { workspace = true }
atlas-multimodal = { workspace = true }
atlas-agent = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_adaptive"]
