[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-collaboration"
version = "0.17.0"
description = "ATLAS Phase 17 - Human-AI Collaboration, Explainability & Governance Ecosystem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "atlas-policy",
    "atlas-observability",
    "atlas-storage",
    "pydantic>=2.7.0",
]

[tool.uv.sources]
atlas-core = { workspace = true }
atlas-policy = { workspace = true }
atlas-observability = { workspace = true }
atlas-storage = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_collaboration"]
