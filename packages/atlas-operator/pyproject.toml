[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-operator"
version = "0.12.0"
description = "ATLAS Kubernetes Operator and Cloud-Native Infrastructure Controller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "atlas-observability",
    "atlas-coordination",
    "atlas-distributed",
    "pydantic>=2.0.0",
]

[tool.uv.sources]
atlas-core = { workspace = true }
atlas-observability = { workspace = true }
atlas-coordination = { workspace = true }
atlas-distributed = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_operator"]
