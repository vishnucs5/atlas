[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-process"
version = "0.16.0"
description = "ATLAS Autonomous Enterprise Process Execution & Digital Workforce Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "atlas-policy",
    "atlas-observability",
    "atlas-storage",
    "atlas-enterprise",
    "atlas-federation",
    "pydantic>=2.7.0",
]

[tool.uv.sources]
atlas-core = { workspace = true }
atlas-policy = { workspace = true }
atlas-observability = { workspace = true }
atlas-storage = { workspace = true }
atlas-enterprise = { workspace = true }
atlas-federation = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_process"]
