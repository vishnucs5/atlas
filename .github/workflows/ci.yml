name: ATLAS Production CI/CD Pipeline

on:
  push:
    branches: [ master, main, feat/* ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-format:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Check Formatting with Ruff
        run: uv run ruff format --check .

  security-scan:
    name: Security & Vulnerability Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Static Security Scan (Bandit)
        run: |
          uv pip install bandit
          uv run bandit -r packages apps -ll -i || true
      - name: Dependency Vulnerability Audit & Security Gate
        run: |
          uv pip install pip-audit
          python scripts/audit_dependencies.py --severity MODERATE

  test-matrix:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [lint-and-format]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Run Pytest Test Suite
        run: uv run pytest -v

  docker-verification:
    name: Container Build & Compose Syntax Validation
    needs: [lint-and-format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Production Compose Syntax
        run: docker compose -f docker-compose.prod.yml config
      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: atlas-api:ci-test
      - name: Build Worker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          tags: atlas-worker:ci-test

  cli-release-verification:
    name: CLI Packaging, Smoke Test & SBOM Verification
    needs: [lint-and-format, security-scan]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Build Package Artifacts
        run: uv build --package atlas-cli
      - name: Generate SBOM and Checksums
        run: uv run python scripts/generate_sbom.py
      - name: Install Built Wheel
        run: uv pip install dist/atlas_cli-*.whl
      - name: Verify CLI Entrypoint & Commands
        run: |
          uv run atlas --version
          uv run atlas doctor
          uv run atlas edition
          uv run atlas skills list
          uv run atlas profiles list
